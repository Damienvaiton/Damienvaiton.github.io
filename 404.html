<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="404.title">Page introuvable · Damien Vaiton</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#080b1d" />

    <link rel="preload" href="/assets/fonts/fell-dw-pica.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/fell-dw-pica-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/css/site.css" />
  </head>

  <body>
    <div class="sky" aria-hidden="true"></div>
    <canvas class="stars" aria-hidden="true"></canvas>

    <header class="nav">
      <nav class="nav-inner" aria-label="Navigation principale">
        <a href="/" class="brand">Damien Vaiton</a>
        <span class="clock">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <span class="sr-only" data-i18n="nav.clockLabel">Horloge, cliquer pour une surprise :</span>
          <span class="clock-time">04:04</span>
        </span>
        <button class="lang-btn" type="button"><span class="sr-only" data-i18n="nav.langLabel">Langue :</span><span data-l="fr">FR</span> <span data-l="en">EN</span></button>
      </nav>
    </header>

    <main id="contenu">
      <section class="hero lost">
        <div class="container">
          <span class="time fade-in" style="--d: 0.1s" data-i18n="404.time">04:04 <span>Page introuvable</span></span>
          <h1>
            <span class="line"><span style="--i: 0" data-i18n="404.l1">Cette page s'est</span></span>
            <span class="line"><span style="--i: 1" data-i18n="404.l2"><em class="gold">perdue dans la nuit</em>.</span></span>
          </h1>
          <p class="hero-lead fade-in" style="--d: 0.7s" data-i18n="404.lead">L'adresse n'existe pas, ou plus.</p>
          <div class="hero-actions fade-in" style="--d: 0.85s">
            <a href="/" class="btn">
              <span data-i18n="404.home">Retour à l'accueil</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
            <a href="/#projets" class="link" data-i18n="404.projects">Voir les projets</a>
          </div>
        </div>
      </section>
    </main>

    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/site.js"></script>
  </body>
</html>
