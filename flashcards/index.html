<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
			name="viewport"
		/>
		<meta name="robots" content="noindex, nofollow, noarchive" />

		<link rel="manifest" href="manifest.webmanifest" />
		<meta name="theme-color" content="#f5f4f9" />

		<!-- Optimisation pour Safari / iOS -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Flashcards" />
		<link rel="apple-touch-icon" href="icon-180.png" />
		<link rel="icon" type="image/png" href="icon-192.png" />
		<title>Flashcards</title>

		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
	</head>

	<body>
		<!-- Toute l'interface est dessinée par app.js selon l'adresse (#/…) -->
		<div id="app"></div>

		<!-- Feuille du bas (ajout, modification, import, réglages du paquet) -->
		<div class="feuille-fond" id="feuilleFond">
			<div class="feuille" id="feuille" role="dialog" aria-modal="true"></div>
		</div>

		<div class="toast" id="toast" role="status" aria-live="polite"></div>

		<script src="app.js" defer></script>
	</body>
</html>
