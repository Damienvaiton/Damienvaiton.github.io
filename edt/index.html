<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
			name="viewport"
		/>
		<meta name="robots" content="noindex, nofollow, noarchive" />

		<link rel="manifest" href="manifest.webmanifest" />
		<meta name="theme-color" content="#0b0f10" />

		<!-- Optimisation pour Safari / iOS -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<meta name="apple-mobile-web-app-title" content="Edt" />
		<link rel="apple-touch-icon" href="icon-512.png" />
		<title>Edt</title>

		<link
			href="https://fonts.googleapis.com/css?family=Space+Grotesk:400,500,600,700|IBM+Plex+Mono:400,500"
			rel="stylesheet"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
	</head>

	<body>
		<!-- ============== APP ============== -->
		<div id="app">
			<div class="wrap-max">
				<header class="topbar">
					<div class="topbar-row">
						<div class="brand">
							<div class="brand-dot"></div>
							<h1>Edt</h1>
						</div>
						<div style="display: flex; gap: 8px">
							<button
								class="icon-btn"
								id="setupBtn"
								aria-label="Réglages de la source ICS"
							>
								<i class="bx bx-cog"></i>
							</button>
							<button
								class="icon-btn"
								id="refreshBtn"
								aria-label="Rafraîchir le planning"
							>
								<i class="bx bx-refresh"></i>
							</button>
						</div>
					</div>
					<div id="statusLine" class="status-line">Chargement…</div>

					<div class="view-switch">
						<button id="viewDayBtn" class="active">Jour</button>
						<button id="viewWeekBtn">Semaine</button>
						<button id="viewMonthBtn">Mois</button>
					</div>
				</header>

				<div id="setupPanel" class="setup-box">
					<strong style="font-size: 0.85rem">Source du calendrier</strong>
					<p>
						Colle le lien ICS (export de la fac), ou colle le contenu .ics
						directement, ou charge un fichier. Mémorisé uniquement sur cet
						appareil.
					</p>
					<input
						type="text"
						id="icsUrlInput"
						placeholder="https://... (lien ICS)"
					/>
					<div class="setup-row">
						<button class="btn primary" id="saveUrlBtn">
							<i class="bx bx-link"></i>Utiliser ce lien
						</button>
						<input type="file" id="icsFileInput" accept=".ics,text/calendar" />
					</div>
					<textarea
						id="icsPasteArea"
						placeholder="…ou colle le contenu ICS ici (BEGIN:VCALENDAR …)"
					></textarea>
					<div class="setup-row">
						<button class="btn" id="savePasteBtn">
							<i class="bx bx-paste"></i>Charger ce texte
						</button>
						<button class="btn" id="clearBtn">
							<i class="bx bx-trash"></i>Vider le cache
						</button>
					</div>
					<div class="setup-row">
						<button class="btn" id="pushBtn" style="display: none">
							<i class="bx bx-bell"></i>Activer les notifs menu
						</button>
					</div>
				</div>

				<!-- DAY VIEW -->
				<div id="dayView">
					<div class="date-nav">
						<button class="icon-btn" id="prevDay" aria-label="Jour précédent">
							<i class="bx bx-chevron-left"></i>
						</button>
						<div class="label" id="dayLabel">—</div>
						<button class="icon-btn" id="nextDay" aria-label="Jour suivant">
							<i class="bx bx-chevron-right"></i>
						</button>
					</div>
					<button class="today-chip" id="todayChipDay">
						<i class="bx bx-calendar-check"></i>Aujourd'hui
					</button>

					<div class="day-mode-switch" id="dayModeSwitch">
						<button id="dayModeListBtn" class="active">
							<i class="bx bx-list-ul"></i>Liste
						</button>
						<button id="dayModeGridBtn">
							<i class="bx bx-grid-alt"></i>Grille
						</button>
					</div>

					<div id="dayListWrap">
						<div id="dayList" class="day-list" style="margin-top: 10px"></div>
					</div>

					<div id="dayGridOuter" style="display: none; margin-top: 10px">
						<div id="dayGridWrap" class="day-grid-wrap">
							<div id="dayGrid" class="day-grid"></div>
						</div>
						<div
							id="dayGridEmpty"
							class="day-empty"
							style="display: none"
						>
							<i class="bx bx-coffee"></i>Aucun cours ce jour-là.
						</div>
					</div>

					<div id="crousSection" class="crous-section" style="display: none">
						<div class="section-label">
							<i class="bx bx-restaurant"></i>Menu du RU
						</div>
						<div id="crousWidget" class="crous-widget"></div>
					</div>

					<div id="vibeWidget" class="vibe-widget" style="display: none"></div>
				</div>

				<!-- WEEK VIEW -->
				<div id="weekView">
					<div class="date-nav">
						<button
							class="icon-btn"
							id="prevWeek"
							aria-label="Semaine précédente"
						>
							<i class="bx bx-chevron-left"></i>
						</button>
						<div class="label" id="weekLabel">—</div>
						<button
							class="icon-btn"
							id="nextWeek"
							aria-label="Semaine suivante"
						>
							<i class="bx bx-chevron-right"></i>
						</button>
					</div>
					<button class="today-chip" id="todayChipWeek">
						<i class="bx bx-calendar-check"></i>Aujourd'hui
					</button>
					<div id="weekList" style="margin-top: 10px"></div>
				</div>

				<!-- MONTH VIEW -->
				<div id="monthView">
					<div class="date-nav">
						<button class="icon-btn" id="prevMonth" aria-label="Mois précédent">
							<i class="bx bx-chevron-left"></i>
						</button>
						<div class="label" id="monthLabel">—</div>
						<button class="icon-btn" id="nextMonth" aria-label="Mois suivant">
							<i class="bx bx-chevron-right"></i>
						</button>
					</div>
					<button class="today-chip" id="todayChipMonth">
						<i class="bx bx-calendar-check"></i>Aujourd'hui
					</button>
					<div class="month-grid" id="monthGrid" style="margin-top: 10px"></div>
					<div class="month-day-panel">
						<div class="panel-label" id="monthPanelLabel"></div>
						<div id="monthDayList" class="day-list"></div>
					</div>
				</div>
			</div>
		</div>

		<!-- ============== EVENT MODAL ============== -->
		<div class="modal-bg" id="modalBg">
			<div class="modal wrap-max">
				<div class="modal-handle"></div>
				<h3 id="modalTitle"></h3>
				<div class="row">
					<i class="bx bx-time"></i><span id="modalTime"></span>
				</div>
				<div class="row" id="modalLocRow">
					<i class="bx bx-map"></i><span id="modalLoc"></span>
				</div>
				<div class="row" id="modalTeacherRow">
					<i class="bx bx-user"></i><span id="modalTeacher"></span>
				</div>
				<div class="row" id="modalDescRow">
					<i class="bx bx-note"></i><span id="modalDesc"></span>
				</div>
				<button class="btn close-btn" id="modalClose">Fermer</button>
			</div>
		</div>

		<script src="app.js" defer></script>
	</body>
</html>
