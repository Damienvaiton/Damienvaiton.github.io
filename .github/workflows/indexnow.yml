# Prévient Bing (et les autres moteurs IndexNow) une fois le site publié par GitHub Pages,
# seulement pour les pages du portfolio qui ont changé.
name: IndexNow

on:
  workflow_run:
    workflows: ["pages-build-deployment", "pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Trouver la publication précédente
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: repos/${{ github.repository }}/actions/workflows/${{ github.event.workflow_run.workflow_id }}/runs?status=success&per_page=20
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          prev=$(gh api "$RUNS" --jq "[.workflow_runs[] | select(.head_sha != \"$HEAD_SHA\")][0].head_sha // empty" || true)
          echo "Publication précédente : ${prev:-inconnue}"
          echo "PREV=$prev" >> "$GITHUB_ENV"

      - name: Envoyer les pages modifiées
        run: bash .github/indexnow.sh
